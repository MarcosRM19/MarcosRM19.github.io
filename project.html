<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project | MarcosRuiz Portfolio</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/project.css">
</head>

<body>

<header>
    <nav class="navbar">
        <a href="index.html#inicio" class="logo" id="logo">
            MarcosRuiz Portfolio
        </a>

        <div class="nav-links">
            <a href="index.html#inicio" id="nav-home" data-i18n="home">Inicio</a>
            <a href="index.html#sobre-mi" id="nav-about" data-i18n="about">Quién soy</a>
            <a href="index.html#experience" id="nav-experience" data-i18n="experience">Experiencia</a>
            <a href="index.html#proyectos" id="nav-projects" data-i18n="projects">Proyectos</a>
            <a href="index.html#documentos" id="nav-documents" data-i18n="documents">Documentos</a>
        </div>

        <div class="nav-actions">
            <button id="language-button" type="button">EN</button>

            <a
                href="index.html#contacto"
                class="contact-button"
                id="contact-button"
                data-i18n="contactButton"
            >
                Contact me
            </a>
        </div>
    </nav>
</header>


<main>

<!-- =====================================================
     TITLE / COVER
====================================================== -->

<section class="title-hero">

    <img
        id="project-hero"
        class="title-bg"
        src=""
        alt=""
    >

    <div class="title-veil"></div>

    <div class="title-inner">

     <div class="title-inner">

    <h1
        id="project-logo-fallback"
        class="logo-fallback"
    ></h1>

    <p
        id="project-tagline"
        class="title-tagline"
    ></p>

    <div class="hero-trailer">

        <div class="youtube-wrapper">

            <iframe
                src="https://www.youtube.com/embed/YIcgUIwu89U"
                title="Lyra Trailer"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

        </div>

    </div>

    <div class="store-links">

        <a
            id="project-itch"
            class="store-link"
            href="#"
            target="_blank"
            rel="noopener"
            aria-label="Itch.io"
        >
            <img
                src="img/itchio.svg"
                alt="Itch.io"
            >
        </a>

    </div>

</div>

        </div>


        <!-- ITCH.IO -->
        <div class="store-links">

            <a
                id="project-itch"
                class="store-link"
                href="#"
                target="_blank"
                rel="noopener"
                aria-label="Itch.io"
            >
                <img
                    src="img/itchio.svg"
                    alt="Itch.io"
                >
            </a>

        </div>

    </div>

</section>


    <!-- =====================================================
         PROJECT INFORMATION
    ====================================================== -->

    <section class="project-hero-v2">

        <div class="project-wrap-wide">

            <div class="ph-grid">

                <!-- LEFT -->
                <div class="ph-intro">

                    <span
                        id="project-category"
                        class="eyebrow"
                    ></span>

                    <h1 id="project-title"></h1>

                    <p
                        id="project-years"
                        class="project-years"
                    ></p>

                    <p
                        id="project-description"
                        class="project-lede"
                    ></p>

                    <p
                        id="project-role"
                        class="project-lede"
                    ></p>


                    <h3
                        id="project-task-title"
                        class="task-heading"
                    ></h3>

                    <ul
                        id="project-tasks"
                        class="task-list"
                    ></ul>


                    <div class="project-actions">

                        <a
                            id="project-play"
                            class="project-btn project-btn-solid"
                            href="#"
                            target="_blank"
                            rel="noopener"
                        ></a>

                        <a
                            class="project-btn project-btn-outline"
                            href="index.html#proyectos"
                            data-i18n="projects"
                        >
                            Más proyectos
                        </a>

                    </div>

                </div>


                <!-- RIGHT -->
                <div class="ph-shots">

                    <button
                        class="ph-shot"
                        type="button"
                        data-project-image="info-right-1"
                    >
                        <img
                            id="project-info-right-1"
                            src=""
                            alt=""
                        >
                    </button>

                    <button
                        class="ph-shot"
                        type="button"
                        data-project-image="info-right-2"
                    >
                        <img
                            id="project-info-right-2"
                            src=""
                            alt=""
                        >
                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- =====================================================
         TRAILER + SCREENSHOTS
    ====================================================== -->

    <section class="trailer-gallery">

        <div class="project-wrap-wide">

            <div class="tg-grid">

                <!-- TRAILER -->
                <div class="trailer-facade">

                    <div class="youtube-wrapper">

                        <iframe
                            src="https://www.youtube.com/embed/YIcgUIwu89U"
                            title="Lyra Trailer"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>
                        </iframe>

                    </div>

                    <span
                        id="trailer-label"
                        class="tg-label"
                    ></span>

                </div>


                <!-- SCREENSHOTS -->
                <div class="tg-gallery">

                    <button
                        class="tg-shot"
                        type="button"
                        data-project-image="screenshot-1"
                    >
                        <img
                            id="project-screenshot-1"
                            src=""
                            alt=""
                        >
                    </button>

                    <button
                        class="tg-shot"
                        type="button"
                        data-project-image="screenshot-2"
                    >
                        <img
                            id="project-screenshot-2"
                            src=""
                            alt=""
                        >
                    </button>

                    <button
                        class="tg-shot"
                        type="button"
                        data-project-image="screenshot-3"
                    >
                        <img
                            id="project-screenshot-3"
                            src=""
                            alt=""
                        >
                    </button>

                    <button
                        class="tg-shot"
                        type="button"
                        data-project-image="screenshot-4"
                    >
                        <img
                            id="project-screenshot-4"
                            src=""
                            alt=""
                        >
                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- =====================================================
         WHAT I LEARNED
    ====================================================== -->

    <section class="project-learning">

        <div class="project-wrap-wide">

            <div class="learning-grid">

                <div class="learning-heading">

                    <span
                        class="eyebrow"
                        data-i18n="learningEyebrow"
                    >
                        LO QUE HE APRENDIDO
                    </span>

                    <h2 id="project-learning-title"></h2>

                </div>

                <div>

                    <ul
                        id="project-learning-list"
                        class="learning-list"
                    ></ul>

                </div>

            </div>

        </div>

    </section>


    <!-- =====================================================
         CONTRIBUTIONS
    ====================================================== -->

    <section class="project-contributions">

        <div class="project-wrap-wide">

            <div class="contributions-header">

                <span
                    class="eyebrow"
                    data-i18n="contributionsEyebrow"
                >
                    CONTRIBUCIONES
                </span>

                <h2 id="project-contributions-title"></h2>

            </div>

            <div
                id="project-contributions-grid"
                class="contributions-grid"
            ></div>

        </div>

    </section>

</main>


<!-- =====================================================
     LIGHTBOX
====================================================== -->

<div
    id="project-lightbox"
    class="project-lightbox"
    aria-hidden="true"
>

    <button
        id="lightbox-close"
        class="lightbox-close"
        type="button"
        aria-label="Close"
    >
        ×
    </button>

    <button
        id="lightbox-prev"
        class="lightbox-arrow lightbox-prev"
        type="button"
        aria-label="Previous image"
    >
        ‹
    </button>

    <div class="lightbox-content">

        <img
            id="lightbox-image"
            src=""
            alt=""
        >

    </div>

    <button
        id="lightbox-next"
        class="lightbox-arrow lightbox-next"
        type="button"
        aria-label="Next image"
    >
        ›
    </button>

</div>


<footer>

    <div class="footer-inner">

        <span>
            © 2026 Marcos Ruiz
        </span>

        <span>
            Game Programmer · Game Designer
        </span>

    </div>

</footer>


<script src="js/script.js"></script>
<script src="js/project.js"></script>

</body>
</html>
