<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project | Marco SRM</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/project.css">
</head>

<body>

    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <header class="navbar">

        <a href="index.html" class="navbar-logo">
            MARCO SRM
        </a>

        <nav class="navbar-nav">
            <a href="index.html#about" data-i18n="nav.about">
                ABOUT
            </a>

            <a href="index.html#experience" data-i18n="nav.experience">
                EXPERIENCE
            </a>

            <a href="index.html#projects" data-i18n="nav.projects">
                PROJECTS
            </a>
        </nav>

        <div class="navbar-actions">

            <button
                id="language-button"
                class="language-button"
                type="button"
            >
                EN
            </button>

            <button
                id="contact-button"
                class="navbar-contact"
                type="button"
                data-i18n="nav.contact"
            >
                CONTACT
            </button>

        </div>

    </header>


    <!-- =====================================================
         PROJECT CONTENT
         ===================================================== -->

    <main id="project-content">

        <!-- =================================================
             TITLE HERO
             ================================================= -->

        <section class="title-hero">

            <img
                id="project-hero"
                class="title-bg"
                src=""
                alt=""
            >

            <div class="title-veil"></div>

            <div class="title-content">

                <img
                    id="project-logo"
                    class="project-logo"
                    src=""
                    alt=""
                >

                <h1 id="project-title-fallback">
                    Project
                </h1>

                <p id="project-tagline"></p>

                <a
                    id="project-itch"
                    class="project-itch-button"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    VIEW ON ITCH.IO
                </a>

            </div>

        </section>


        <!-- =================================================
             PROJECT INFORMATION
             ================================================= -->

        <section class="project-hero-v2">

            <div class="ph-grid">

                <!-- LEFT -->

                <div class="ph-left">

                    <img
                        id="project-info-left"
                        src=""
                        alt=""
                    >

                </div>


                <!-- CENTER -->

                <div class="ph-center">

                    <p
                        id="project-role"
                        class="project-role"
                    ></p>

                    <p
                        id="project-description"
                        class="project-description"
                    ></p>

                    <div class="project-meta">

                        <div class="meta-item">
                            <span
                                class="meta-label"
                                data-i18n="project.platform"
                            >
                                PLATFORM
                            </span>

                            <span
                                id="project-platform"
                                class="meta-value"
                            ></span>
                        </div>

                        <div class="meta-item">
                            <span
                                class="meta-label"
                                data-i18n="project.engine"
                            >
                                ENGINE
                            </span>

                            <span
                                id="project-engine"
                                class="meta-value"
                            ></span>
                        </div>

                        <div class="meta-item">
                            <span
                                class="meta-label"
                                data-i18n="project.team"
                            >
                                TEAM
                            </span>

                            <span
                                id="project-team"
                                class="meta-value"
                            ></span>
                        </div>

                        <div class="meta-item">
                            <span
                                class="meta-label"
                                data-i18n="project.date"
                            >
                                DATE
                            </span>

                            <span
                                id="project-date"
                                class="meta-value"
                            ></span>
                        </div>

                    </div>

                </div>


                <!-- RIGHT -->

                <div class="ph-right">

                    <button
                        class="project-image-button"
                        type="button"
                        data-project-image="info-right-1"
                    >
                        <img
                            id="project-info-right-1"
                            src=""
                            alt=""
                        >
                    </button>

                    <button
                        class="project-image-button"
                        type="button"
                        data-project-image="info-right-2"
                    >
                        <img
                            id="project-info-right-2"
                            src=""
                            alt=""
                        >
                    </button>

                </div>

            </div>

        </section>


        <!-- =================================================
             TRAILER + SCREENSHOTS
             ================================================= -->

        <section class="trailer-gallery">

            <div class="trailer-block">

                <button
                    id="trailer-button"
                    class="trailer-button"
                    type="button"
                >

                    <img
                        id="trailer-image"
                        src=""
                        alt="Project trailer"
                    >

                    <div class="trailer-overlay">

                        <span class="trailer-play">
                            ▶
                        </span>

                        <span
                            class="trailer-label"
                            data-i18n="project.watchTrailer"
                        >
                            WATCH TRAILER
                        </span>

                    </div>

                </button>

            </div>


            <div class="screenshots-grid">

                <button
                    class="screenshot-button"
                    type="button"
                    data-project-image="screenshot-1"
                >
                    <img
                        id="project-screenshot-1"
                        src=""
                        alt="Project screenshot 1"
                    >
                </button>

                <button
                    class="screenshot-button"
                    type="button"
                    data-project-image="screenshot-2"
                >
                    <img
                        id="project-screenshot-2"
                        src=""
                        alt="Project screenshot 2"
                    >
                </button>

                <button
                    class="screenshot-button"
                    type="button"
                    data-project-image="screenshot-3"
                >
                    <img
                        id="project-screenshot-3"
                        src=""
                        alt="Project screenshot 3"
                    >
                </button>

                <button
                    class="screenshot-button"
                    type="button"
                    data-project-image="screenshot-4"
                >
                    <img
                        id="project-screenshot-4"
                        src=""
                        alt="Project screenshot 4"
                    >
                </button>

            </div>

        </section>


        <!-- =================================================
             CONTRIBUTIONS
             ================================================= -->

        <section class="contributions">

            <img
                id="contributions-bg"
                class="contributions-bg"
                src=""
                alt=""
            >

            <div class="contributions-overlay"></div>

            <div class="contributions-content">

                <h2 id="contributions-title">
                    Mis Contribuciones
                </h2>

                <p id="contributions-intro"></p>

                <div id="contribution-list"></div>


                <!-- =========================================
                     LEARNING
                     ========================================= -->

                <div class="learning-block">

                    <h2 id="learning-title">
                        Lo que aprendí
                    </h2>

                    <p id="learning-text"></p>

                </div>


                <!-- =========================================
                     CTA
                     ========================================= -->

                <div class="project-cta">

                    <a
                        id="project-cta-link"
                        class="project-cta-button"
                        href="index.html#projects"
                    >
                        <span data-i18n="project.backToProjects">
                            BACK TO PROJECTS
                        </span>
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         LIGHTBOX
         ===================================================== -->

    <div
        id="lightbox"
        class="lightbox"
        aria-hidden="true"
    >

        <button
            id="lightbox-close"
            class="lightbox-close"
            type="button"
            aria-label="Close"
        >
            ×
        </button>

        <button
            id="lightbox-prev"
            class="lightbox-arrow lightbox-prev"
            type="button"
            aria-label="Previous image"
        >
            ‹
        </button>

        <div class="lightbox-content">

            <img
                id="lightbox-image"
                src=""
                alt=""
            >

        </div>

        <button
            id="lightbox-next"
            class="lightbox-arrow lightbox-next"
            type="button"
            aria-label="Next image"
        >
            ›
        </button>

    </div>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="footer">

        <div class="footer-content">

            <p>
                © 2026 Marco SRM
            </p>

            <a href="index.html">
                PORTFOLIO
            </a>

        </div>

    </footer>


    <!-- =====================================================
         CONTACT MODAL
         ===================================================== -->

    <div
        id="contact-modal"
        class="modal"
        aria-hidden="true"
    >

        <div class="modal-overlay"></div>

        <div class="modal-content">

            <button
                id="close-modal"
                class="modal-close"
                type="button"
                aria-label="Close"
            >
                ×
            </button>

            <h2 data-i18n="contact.title">
                CONTACT
            </h2>

            <p data-i18n="contact.text">
                Let's talk.
            </p>

            <div class="contact-links">

                <a
                    href="mailto:"
                    data-contact-email
                >
                    EMAIL
                </a>

                <a
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-contact-linkedin
                >
                    LINKEDIN
                </a>

                <a
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-contact-github
                >
                    GITHUB
                </a>

            </div>

        </div>

    </div>


    <!-- =====================================================
         SCRIPTS
         ===================================================== -->

    <script src="js/script.js"></script>
    <script src="js/project.js"></script>

</body>

</html>
