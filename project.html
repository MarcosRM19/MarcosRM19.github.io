<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project | MarcosRuiz Portfolio</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/project.css">
</head>

<body>

<header>
    <nav class="navbar">

        <a
            href="index.html#inicio"
            class="logo"
            id="logo"
        >
            MarcosRuiz Portfolio
        </a>

        <div class="nav-links">

            <a
                href="index.html#inicio"
                id="nav-home"
                data-i18n="home"
            >
                Inicio
            </a>

            <a
                href="index.html#sobre-mi"
                id="nav-about"
                data-i18n="about"
            >
                Quién soy
            </a>

            <a
                href="index.html#experience"
                id="nav-experience"
                data-i18n="experience"
            >
                Experiencia
            </a>

            <a
                href="index.html#proyectos"
                id="nav-projects"
                data-i18n="projects"
            >
                Proyectos
            </a>

            <a
                href="index.html#documentos"
                id="nav-documents"
                data-i18n="documents"
            >
                Documentos
            </a>

        </div>

        <div class="nav-actions">

            <button
                id="language-button"
                type="button"
            >
                EN
            </button>

            <a
                href="index.html#contacto"
                class="contact-button"
                id="contact-button"
                data-i18n="contactButton"
            >
                Contact me
            </a>

        </div>

    </nav>
</header>


<main>

    <!-- HERO / TRAILER DE FONDO -->

    <section class="title-hero">

        <div class="hero-video">

            <iframe
                src="https://www.youtube.com/embed/YIcgUIwu89U?autoplay=1&mute=1&loop=1&playlist=YIcgUIwu89U&controls=0&rel=0&modestbranding=1"
                title="Lyra Trailer"
                allow="autoplay; encrypted-media"
                frameborder="0">
            </iframe>

        </div>

        <div class="title-veil"></div>

        <div class="title-inner">

            <p
                id="project-category"
                class="project-category"
            ></p>

            <h1
                id="project-logo-fallback"
                class="logo-fallback"
            ></h1>

            <p
                id="project-tagline"
                class="title-tagline"
            ></p>

            <div class="store-links">

                <a
                    id="project-itch"
                    class="store-link"
                    href="#"
                    target="_blank"
                    rel="noopener"
                    aria-label="Itch.io"
                >
                    <img
                        src="img/itchio.svg"
                        alt="Itch.io"
                    >
                </a>

            </div>

        </div>

    </section>


    <!-- INFORMACIÓN PRINCIPAL -->

    <section class="project-intro">

        <div class="project-intro-grid">

            <div class="project-intro-main">

                <p
                    class="section-label"
                    id="project-years"
                ></p>

                <h2 id="project-title"></h2>

                <p
                    id="project-description"
                    class="project-description"
                ></p>

            </div>

            <div class="project-intro-side">

                <div class="project-role">

                    <span class="section-label">
                        ROLE
                    </span>

                    <p id="project-role"></p>

                </div>

                <div class="project-play-wrapper">

                    <a
                        id="project-play"
                        class="project-play"
                        href="#"
                        target="_blank"
                        rel="noopener"
                    >
                        Play on itch.io
                    </a>

                </div>

            </div>

        </div>

    </section>


    <!-- INFORMACIÓN VISUAL -->

    <section class="project-info">

        <div class="project-info-grid">

            <div class="project-info-left">

                <div class="project-info-block">

                    <span class="section-label">
                        TASK OVERVIEW
                    </span>

                    <h2 id="project-task-title"></h2>

                    <ul id="project-tasks"></ul>

                </div>

            </div>


            <div class="project-info-right">

                <figure class="project-image">

                    <img
                        id="project-info-right-1"
                        src=""
                        alt=""
                    >

                </figure>

                <figure class="project-image">

                    <img
                        id="project-info-right-2"
                        src=""
                        alt=""
                    >

                </figure>

            </div>

        </div>

    </section>


    <!-- SCREENSHOTS -->

    <section class="project-screenshots">

        <div class="section-heading">

            <span class="section-label">
                SCREENSHOTS
            </span>

        </div>

        <div class="screenshots-grid">

            <button
                type="button"
                class="project-image-button"
                data-project-image
            >
                <img
                    id="project-screenshot-1"
                    src=""
                    alt=""
                >
            </button>

            <button
                type="button"
                class="project-image-button"
                data-project-image
            >
                <img
                    id="project-screenshot-2"
                    src=""
                    alt=""
                >
            </button>

            <button
                type="button"
                class="project-image-button"
                data-project-image
            >
                <img
                    id="project-screenshot-3"
                    src=""
                    alt=""
                >
            </button>

            <button
                type="button"
                class="project-image-button"
                data-project-image
            >
                <img
                    id="project-screenshot-4"
                    src=""
                    alt=""
                >
            </button>

        </div>

    </section>


    <!-- LEARNING -->

    <section class="project-learning">

        <div class="project-learning-grid">

            <div>

                <span class="section-label">
                    LEARNING
                </span>

                <h2 id="project-learning-title"></h2>

            </div>

            <div>

                <ul id="project-learning-list"></ul>

            </div>

        </div>

    </section>


    <!-- CONTRIBUTIONS -->

    <section class="project-contributions">

        <div class="section-heading">

            <span class="section-label">
                CONTRIBUTIONS
            </span>

            <h2 id="project-contributions-title"></h2>

        </div>

        <div
            id="project-contributions-grid"
            class="contributions-grid"
        ></div>

    </section>

</main>


<!-- LIGHTBOX -->

<div
    id="project-lightbox"
    class="project-lightbox"
    aria-hidden="true"
>

    <button
        id="lightbox-close"
        class="lightbox-close"
        type="button"
        aria-label="Close image"
    >
        ×
    </button>

    <button
        id="lightbox-prev"
        class="lightbox-arrow lightbox-prev"
        type="button"
        aria-label="Previous image"
    >
        ‹
    </button>

    <div class="lightbox-content">

        <img
            id="lightbox-image"
            src=""
            alt=""
        >

    </div>

    <button
        id="lightbox-next"
        class="lightbox-arrow lightbox-next"
        type="button"
        aria-label="Next image"
    >
        ›
    </button>

</div>


<script src="js/project.js"></script>

</body>
</html>
