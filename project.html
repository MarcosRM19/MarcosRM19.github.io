<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project | Marcos RM</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/project.css">
</head>

<body>

    <!-- =====================================================
         NAVBAR ORIGINAL
    ====================================================== -->

    <header class="navbar">

        <div class="navbar-logo">
            <a href="index.html">MR</a>
        </div>

        <nav class="navbar-nav">

            <a href="index.html#about" data-i18n="nav.about">
                Sobre mí
            </a>

            <a href="index.html#experience" data-i18n="nav.experience">
                Experiencia
            </a>

            <a href="index.html#projects" data-i18n="nav.projects">
                Proyectos
            </a>

            <a href="index.html#documents" data-i18n="nav.documents">
                Documentos
            </a>

        </nav>

        <div class="navbar-actions">

            <button
                id="language-button"
                class="language-button"
                type="button"
            >
                ES
            </button>

            <a
                href="index.html#contact"
                class="contact-button"
                data-i18n="nav.contact"
            >
                Contacto
            </a>

        </div>

    </header>


    <!-- =====================================================
         PROJECT
    ====================================================== -->

    <main id="project-content">


        <!-- HERO -->
        <section class="title-hero">

            <video
                id="hero-video"
                class="title-bg"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
            ></video>

            <div class="title-veil"></div>

            <div class="title-inner">

                <img
                    id="project-logo"
                    class="game-logo"
                    src=""
                    alt=""
                >

                <h1
                    id="project-logo-fallback"
                    class="logo-fallback"
                ></h1>

                <p
                    id="project-tagline"
                    class="title-tagline"
                ></p>

                <div class="store-links">

                    <a
                        id="project-itch"
                        class="store-link"
                        href="#"
                        target="_blank"
                        rel="noopener"
                        aria-label="itch.io"
                    >
                        <img
                            src="https://cdn.simpleicons.org/itchdotio/11120f"
                            alt=""
                        >
                    </a>

                </div>

            </div>

        </section>


        <!-- =====================================================
             PROJECT INTRO
        ====================================================== -->

        <section class="project-hero-v2">

            <div class="project-wrap-wide">

                <div class="ph-grid">


                    <!-- CHARACTER -->

                    <div class="ph-mascot">

                        <img
                            id="project-character"
                            src=""
                            alt=""
                            loading="lazy"
                        >

                    </div>


                    <!-- TEXT -->

                    <div class="ph-intro">

                        <h1 id="project-title"></h1>

                        <span
                            id="project-category"
                            class="eyebrow"
                        ></span>

                        <p
                            id="project-years"
                            class="project-years"
                        ></p>


                        <p
                            id="project-description"
                            class="project-lede"
                        ></p>

                        <p
                            id="project-role"
                            class="project-lede"
                        ></p>


                        <h3
                            id="project-task-title"
                            class="task-heading"
                        ></h3>

                        <ul
                            id="project-tasks"
                            class="task-list"
                        ></ul>


                        <div class="project-actions">

                            <a
                                id="project-play"
                                class="project-btn project-btn-solid"
                                href="#"
                                target="_blank"
                                rel="noopener"
                            ></a>

                            <a
                                class="project-btn project-btn-outline"
                                href="index.html#projects"
                                data-i18n="project.more"
                            >
                                More projects
                            </a>

                        </div>

                    </div>


                    <!-- RIGHT IMAGES -->

                    <div
                        id="project-side-images"
                        class="ph-shots"
                    ></div>

                </div>

            </div>

        </section>


        <!-- =====================================================
             TRAILER + GALLERY
        ====================================================== -->

        <section class="trailer-gallery">

            <div class="project-wrap-wide">

                <div class="tg-grid">

                    <div class="tg-trailer">

                        <button
                            id="trailer-button"
                            class="trailer-facade"
                            type="button"
                        >

                            <img
                                id="trailer-image"
                                src=""
                                alt=""
                            >

                            <span class="play-badge"></span>

                            <span
                                id="trailer-label"
                                class="tg-label"
                            >
                                OFFICIAL TRAILER
                            </span>

                        </button>

                    </div>


                    <div
                        id="project-gallery"
                        class="tg-gallery"
                    ></div>

                </div>

            </div>

        </section>


        <!-- =====================================================
             CONTRIBUTIONS
        ====================================================== -->

        <section class="contributions">

            <video
                id="contributions-video"
                class="contrib-bg"
                autoplay
                muted
                loop
                playsinline
                preload="none"
                aria-hidden="true"
            ></video>

            <div class="contrib-veil"></div>


            <div class="project-wrap contributions-inner">

                <div class="contrib-grid">

                    <div class="contrib-text">

                        <h2 id="contributions-title"></h2>

                        <p id="contributions-intro"></p>

                        <ul
                            id="contribution-list"
                            class="contribution-list"
                        ></ul>

                    </div>


                    <div class="learning-block">

                        <h2 id="learning-title"></h2>

                        <p id="learning-text"></p>

                    </div>

                </div>


                <div class="case-cta">

                    <a
                        id="bottom-play"
                        class="project-btn project-btn-solid"
                        href="#"
                        target="_blank"
                        rel="noopener"
                    ></a>

                    <a
                        class="project-btn project-btn-outline"
                        href="index.html#projects"
                        data-i18n="project.more"
                    >
                        More projects
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         LIGHTBOX
    ====================================================== -->

    <div
        id="project-lightbox"
        class="project-lightbox"
        aria-hidden="true"
    >

        <button
            class="lightbox-close"
            type="button"
        >
            ×
        </button>

        <button
            class="lightbox-prev"
            type="button"
        >
            ‹
        </button>

        <div class="lightbox-content">

            <img
                id="lightbox-image"
                src=""
                alt=""
            >

            <p id="lightbox-caption"></p>

        </div>

        <button
            class="lightbox-next"
            type="button"
        >
            ›
        </button>

    </div>


    <!-- FOOTER -->

    <footer class="footer">
        <p>© 2026 Marcos RM</p>
    </footer>


    <script src="js/script.js"></script>
    <script src="js/project.js"></script>

</body>

</html>
