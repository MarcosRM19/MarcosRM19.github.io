<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title id="page-title">
        Proyecto | MarcosRuiz Portfolio
    </title>

    <link
        rel="stylesheet"
        href="css/style.css">

    <link
        rel="stylesheet"
        href="css/project.css">

</head>

<body>

    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <header>

        <nav class="navbar">

            <a
                href="index.html#inicio"
                class="logo"
                id="logo">
                MarcosRuiz Portfolio
            </a>

            <div class="nav-links">

                <a
                    href="index.html#inicio"
                    id="nav-home"
                    data-i18n="home">
                    Inicio
                </a>

                <a
                    href="index.html#sobre-mi"
                    id="nav-about"
                    data-i18n="about">
                    Quién soy
                </a>

                <a
                    href="index.html#experience"
                    id="nav-experience"
                    data-i18n="experience">
                    Experiencia
                </a>

                <a
                    href="index.html#proyectos"
                    id="nav-projects"
                    data-i18n="projects">
                    Proyectos
                </a>

                <a
                    href="index.html#documentos"
                    id="nav-documents"
                    data-i18n="documents">
                    Documentos
                </a>

            </div>

            <div class="nav-actions">

                <button
                    id="language-button"
                    type="button">
                    EN
                </button>

                <a
                    href="index.html#contacto"
                    class="contact-button"
                    id="contact-button"
                    data-i18n="contactButton">
                    Contact me
                </a>

            </div>

        </nav>

    </header>


    <main id="project-content">

        <!-- =================================================
             HERO PRINCIPAL
             ================================================= -->

        <section class="title-hero">

            <img
                id="project-hero"
                class="title-bg"
                src=""
                alt=""
                loading="eager">

            <div class="title-veil"></div>

            <div class="title-inner">

                <img
                    id="project-logo"
                    class="game-logo"
                    src=""
                    alt=""
                    loading="eager">

                <h1
                    id="project-logo-fallback"
                    class="logo-fallback">
                </h1>

                <p
                    id="project-tagline"
                    class="title-tagline">
                </p>

                <div class="store-links">

                    <a
                        id="project-itch"
                        class="store-link"
                        href="#"
                        target="_blank"
                        rel="noopener"
                        aria-label="Itch.io">

                        <span>▶</span>

                    </a>

                </div>

            </div>

        </section>


        <!-- =================================================
             PRIMERA PARTE DEL PROYECTO
             50% INFO / 50% IMÁGENES
             ================================================= -->

        <section class="project-hero-v2">

            <div class="project-wrap-wide">

                <div class="ph-grid">

                    <!-- =====================================
                         MITAD IZQUIERDA — INFORMACIÓN
                         ===================================== -->

                    <div class="ph-intro">

                        <span
                            id="project-category"
                            class="eyebrow">
                        </span>

                        <h1
                            id="project-title">
                        </h1>

                        <p
                            id="project-years"
                            class="project-years">
                        </p>

                        <p
                            id="project-description"
                            class="project-lede">
                        </p>

                        <p
                            id="project-role"
                            class="project-lede">
                        </p>


                        <h3
                            id="project-task-title"
                            class="task-heading">
                        </h3>

                        <ul
                            id="project-tasks"
                            class="task-list">
                        </ul>


                        <div class="project-actions">

                            <a
                                id="project-play"
                                class="project-btn project-btn-solid"
                                href="#"
                                target="_blank"
                                rel="noopener">
                            </a>

                            <a
                                class="project-btn project-btn-outline"
                                href="index.html#proyectos"
                                data-i18n="projects">
                                More projects
                            </a>

                        </div>

                    </div>


                    <!-- =====================================
                         MITAD DERECHA — DOS IMÁGENES
                         ===================================== -->

                    <div class="ph-shots">

                        <button
                            class="ph-shot"
                            type="button"
                            data-project-image="info-right-1">

                            <img
                                id="project-info-right-1"
                                src=""
                                alt=""
                                loading="lazy">

                        </button>


                        <button
                            class="ph-shot"
                            type="button"
                            data-project-image="info-right-2">

                            <img
                                id="project-info-right-2"
                                src=""
                                alt=""
                                loading="lazy">

                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             TRAILER + GALERÍA
             ================================================= -->

        <section class="trailer-gallery">

            <div class="project-wrap-wide">

                <div class="tg-grid">

                    <button
                        class="trailer-facade"
                        type="button"
                        data-project-image="trailer">

                        <img
                            id="project-trailer-image"
                            src=""
                            alt=""
                            loading="lazy">

                        <span class="play-badge"></span>

                        <span
                            class="tg-label"
                            id="trailer-label">
                        </span>

                    </button>


                    <div class="tg-gallery">

                        <button
                            class="tg-shot"
                            type="button"
                            data-project-image="screenshot-1">

                            <img
                                id="project-screenshot-1"
                                src=""
                                alt=""
                                loading="lazy">

                        </button>

                        <button
                            class="tg-shot"
                            type="button"
                            data-project-image="screenshot-2">

                            <img
                                id="project-screenshot-2"
                                src=""
                                alt=""
                                loading="lazy">

                        </button>

                        <button
                            class="tg-shot"
                            type="button"
                            data-project-image="screenshot-3">

                            <img
                                id="project-screenshot-3"
                                src=""
                                alt=""
                                loading="lazy">

                        </button>

                        <button
                            class="tg-shot"
                            type="button"
                            data-project-image="screenshot-4">

                            <img
                                id="project-screenshot-4"
                                src=""
                                alt=""
                                loading="lazy">

                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             CONTRIBUCIONES
             ================================================= -->

        <section class="contributions">

            <div class="project-wrap">

                <div class="contributions-inner">

                    <div class="contrib-text">

                        <h2
                            id="contributions-title">
                        </h2>

                        <p
                            id="contributions-intro">
                        </p>

                        <ul
                            id="contribution-list"
                            class="contribution-list">
                        </ul>

                    </div>


                    <div class="learning-block">

                        <h2
                            id="learning-title">
                        </h2>

                        <p
                            id="learning-text">
                        </p>

                    </div>


                    <div class="case-cta">

                        <a
                            id="contribution-play"
                            class="project-btn project-btn-solid"
                            href="#"
                            target="_blank"
                            rel="noopener">
                        </a>

                        <a
                            class="project-btn project-btn-outline"
                            href="index.html#proyectos"
                            data-i18n="projects">
                            More projects
                        </a>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         LIGHTBOX
         ===================================================== -->

    <div
        id="project-lightbox"
        class="project-lightbox"
        aria-hidden="true">

        <button
            class="lightbox-close"
            id="lightbox-close"
            type="button"
            aria-label="Close">
            ×
        </button>

        <button
            class="lightbox-prev"
            id="lightbox-prev"
            type="button"
            aria-label="Previous image">
            ‹
        </button>

        <div class="lightbox-content">

            <img
                id="lightbox-image"
                src=""
                alt="">

            <p
                id="lightbox-caption">
            </p>

        </div>

        <button
            class="lightbox-next"
            id="lightbox-next"
            type="button"
            aria-label="Next image">
            ›
        </button>

    </div>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

        <div class="footer-inner">

            <p>
                © <span id="footer-year"></span>
                MarcosRuiz Portfolio
            </p>

        </div>

    </footer>


    <script src="js/script.js"></script>
    <script src="js/project.js"></script>

</body>

</html>
